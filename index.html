<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AA23 sobre AA21 · Catálogo de productos</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/app.js" defer></script>
</head>
<body>
    <main>
        <header>
            <p class="etiqueta">AA23 · Evolución del buscador de AA21</p>
            <h1>Catálogo de productos</h1>
            <p>Buscá por nombre o categoría y agregá productos al catálogo.</p>
        </header>
        <section class="search-box" aria-label="Cuenta de usuario">
            <p id="estado-sesion" role="status" aria-live="polite">Comprobando sesión…</p>
            <div id="panel-invitado" hidden>
                <div class="auth-grid">
                    <form id="form-login">
                        <h2>Iniciar sesión</h2>
                        <label for="login-email">Correo electrónico</label>
                        <input type="email" id="login-email" name="email" maxlength="100" autocomplete="username" required>
                        <label for="login-password">Contraseña</label>
                        <input type="password" id="login-password" name="password" maxlength="72" autocomplete="current-password" required>
                        <button type="submit" disabled>Ingresar</button>
                    </form>
                    <details id="registro-cuenta">
                        <summary>Crear cuenta</summary>
                        <form id="form-registro">
                            <label for="registro-nombre">Nombre</label>
                            <input type="text" id="registro-nombre" name="nombre" maxlength="100" autocomplete="name" required>
                            <label for="registro-email">Correo electrónico</label>
                            <input type="email" id="registro-email" name="email" maxlength="100" autocomplete="email" required>
                            <label for="registro-password">Contraseña</label>
                            <input type="password" id="registro-password" name="password" minlength="8" maxlength="72" autocomplete="new-password" aria-describedby="ayuda-password" required>
                            <p class="ayuda" id="ayuda-password">Usá al menos 8 caracteres.</p>
                            <button type="submit" disabled>Registrarme</button>
                        </form>
                    </details>
                </div>
                <p id="estado-auth" role="status" aria-live="polite"></p>
            </div>
            <div id="panel-usuario" hidden>
                <p>Sesión iniciada como <strong id="nombre-usuario"></strong></p>
                <p id="email-usuario" class="categoria"></p>
                <button type="button" id="cerrar-sesion">Cerrar sesión</button>
            </div>
        </section>
        <section class="search-box" aria-label="Buscar productos">
            <form id="form-buscar">
                <label for="input-buscar">Nombre o categoría</label>
                <div class="form-group">
                    <input type="search" id="input-buscar" name="q" maxlength="100" placeholder="Ej.: teclado, monitores, audio">
                    <button type="submit">Buscar</button>
                    <button type="button" id="mostrar-todos" class="secundario">Ver todos</button>
                </div>
            </form>
        </section>

        <details class="search-box" id="panel-producto" hidden>
            <summary>Agregar producto</summary>
            <form id="form-producto">
                <div class="campos">
                    <div>
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre" maxlength="100" required>
                    </div>
                    <div>
                        <label for="categoria">Categoría</label>
                        <input type="text" id="categoria" name="categoria" maxlength="50" required>
                    </div>
                    <div>
                        <label for="precio">Precio ($)</label>
                        <input type="number" id="precio" name="precio" min="0" max="99999999.99" step="0.01" required>
                    </div>
                    <div>
                        <label for="stock">Stock</label>
                        <input type="number" id="stock" name="stock" min="0" max="2147483647" step="1" value="0" required>
                    </div>
                </div>
                <button type="submit" id="guardar-producto" disabled>Guardar producto</button>
                <p id="estado-producto" role="status" aria-live="polite"></p>
            </form>
        </details>

        <p id="estado-busqueda" role="status" aria-live="polite">Cargando productos…</p>
        <section id="resultados" aria-label="Resultados de la búsqueda" aria-busy="true"></section>
    </main>
</body>
</html>
